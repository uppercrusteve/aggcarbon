name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install package
        run: python -m pip install -e . pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Smoke test CLI
        run: |
          aggcarbon validate examples/aggregates_demo.csv
          aggcarbon compute examples/aggregates_demo.csv --reference CK -o out --bootstrap 100 --quiet
          test -s out/carbon-indices.png
