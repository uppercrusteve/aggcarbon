[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggcarbon"
version = "0.1.0"
description = "Soil aggregate stability and carbon pool indices with ESM correction and bootstrap confidence intervals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "uppercrusteve", email = "uppercrusteve@users.noreply.github.com" }]
keywords = ["soil", "aggregate stability", "soil organic carbon", "MWD", "GMD", "CMI", "ESM"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Agriculture",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
aggcarbon = "aggcarbon.cli:main"

[project.urls]
Homepage = "https://github.com/uppercrusteve/aggcarbon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aggcarbon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
